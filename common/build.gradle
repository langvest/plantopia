plugins {
    id "fabric-loom" version "$fabric_gradle_version"
}

dependencies {
    minecraft "com.mojang:minecraft:$minecraft_version"
    mappings loom.layered {
        officialMojangMappings()
        parchment "org.parchmentmc.data:parchment-$minecraft_version:$parchment_version@zip"
    }
    compileOnly "org.spongepowered:mixin:$mixin_version"
    implementation "org.ow2.asm:asm:9.6" // Required for Mixins
    implementation "org.ow2.asm:asm-tree:9.6" // Required for Mixins
    implementation "net.jodah:typetools:0.6.3" // Required for LanGvest Toolkit
    compileOnly "com.github.glitchfiend:TerraBlender-common:$minecraft_version-$terrablender_version"
    compileOnly "com.google.code.findbugs:jsr305:$findbugs_version"
}

loom {
    if (file(access_widener_path).exists()) {
        accessWidenerPath = file(access_widener_path)
    }
}

sourceSets {
    main {
        resources {
            srcDir "src/generated/resources"
            exclude ".cache"
        }
    }
}
